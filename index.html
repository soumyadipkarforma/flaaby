<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Dino</title>
<style>
  html, body { margin: 0; height: 100%; background: #353535; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
  canvas {
    width: min(100vw, calc(70vh * 2.73));
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #353535;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: min(100vw, calc(70vh * 2.73));
    margin: 10px auto 0;
    padding: 0 10px;
    box-sizing: border-box;
  }
  .links a {
    font-family: Consolas, Menlo, monospace;
    font-size: 12px;
    line-height: 1;
    color: #7cffb2;
    background: #2c2c2c;
    border: 1px solid #4a4a4a;
    border-radius: 4px;
    padding: 6px 10px;
    text-decoration: none;
    white-space: nowrap;
  }
  .links a:hover { border-color: #7cffb2; color: #ffffff; }
  .cs50 {
    font-family: Consolas, Menlo, monospace;
    font-size: 11px;
    color: #8a8a8a;
    margin-top: 10px;
    text-align: center;
  }
  .cs50 a { color: #8a8a8a; text-decoration: none; }
  .cs50 a:hover { color: #ffffff; }
</style>
</head>
